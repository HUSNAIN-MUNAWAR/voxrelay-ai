name: Bug report
description: Report a reproducible defect in VoxRelay AI
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve VoxRelay AI. Please include enough detail for someone else to reproduce the issue locally.
  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: One-sentence description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the API
        2. Open the dashboard
        3. Trigger a simulated call
        4. Observe the failing behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python, Node, browser, Docker details, and any relevant env settings
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      render: shell
